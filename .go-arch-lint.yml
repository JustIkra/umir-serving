version: 3
workdir: .
allow:
  deepScan: false
  depOnAnyVendor: false
  ignoreNotFoundComponents: true
excludeFiles:
  - "^.*internal/application/.*_test\\.go$"
vendors:
  pgx: {in: ["github.com/jackc/pgx/v5", "github.com/jackc/pgx/v5/**"]}
  amqp: {in: ["github.com/rabbitmq/amqp091-go"]}
components:
  domain: {in: "internal/domain/**"}
  contract: {in: "contract/**"}
  application: {in: "internal/application/**"}
  adapters: {in: "internal/adapters/**"}
  bootstrap: {in: "bootstrap/**"}
  process: {in: "cmd/**"}
  testsupport: {in: "tests/testsupport/**"}
  tests: {in: "tests/**"}
deps:
  domain:
    mayDependOn: [domain]
  contract:
    mayDependOn: [contract]
  application:
    mayDependOn: [application, domain, contract]
  adapters:
    mayDependOn: [adapters, application, domain, contract]
    canUse: [pgx, amqp]
  bootstrap:
    mayDependOn: [bootstrap, application, adapters, contract]
  process:
    mayDependOn: [process, bootstrap]
  testsupport:
    mayDependOn: [testsupport, domain, contract]
  tests:
    mayDependOn: [tests, testsupport, application, adapters, domain, contract, bootstrap]
    canUse: [pgx, amqp]
